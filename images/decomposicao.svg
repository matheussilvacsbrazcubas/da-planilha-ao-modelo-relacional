<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Modelo final do exemplo de pedidos</title>
  <desc id="desc">Quatro tabelas relacionadas: clientes aponta para pedidos; pedidos aponta para itens_pedido; produtos também aponta para itens_pedido.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176c8d"/></marker>
  </defs>
  <rect width="960" height="280" rx="18" fill="#f8fbfc"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g>
      <rect x="28" y="86" width="190" height="108" rx="14" fill="#d9f3ed" stroke="#218475" stroke-width="2"/>
      <text x="48" y="119" fill="#123c44" font-size="20" font-weight="700">clientes</text>
      <text x="48" y="151" fill="#294b55" font-size="15">PK cliente_id</text>
      <text x="48" y="175" fill="#294b55" font-size="14">nome · email</text>
    </g>
    <g>
      <rect x="270" y="86" width="190" height="108" rx="14" fill="#e6efff" stroke="#4772b2" stroke-width="2"/>
      <text x="290" y="119" fill="#183657" font-size="20" font-weight="700">pedidos</text>
      <text x="290" y="151" fill="#334d69" font-size="15">PK pedido_id</text>
      <text x="290" y="175" fill="#334d69" font-size="14">FK cliente_id · data</text>
    </g>
    <g>
      <rect x="510" y="86" width="190" height="108" rx="14" fill="#fff0d8" stroke="#bd8121" stroke-width="2"/>
      <text x="530" y="119" fill="#5c4219" font-size="20" font-weight="700">itens_pedido</text>
      <text x="530" y="151" fill="#6e562f" font-size="14">PK/FK pedido_id</text>
      <text x="530" y="175" fill="#6e562f" font-size="14">PK/FK produto_id · qtd. · preço</text>
    </g>
    <g>
      <rect x="752" y="86" width="180" height="108" rx="14" fill="#f0e7fa" stroke="#8761aa" stroke-width="2"/>
      <text x="772" y="119" fill="#452e5d" font-size="20" font-weight="700">produtos</text>
      <text x="772" y="151" fill="#58466d" font-size="15">PK produto_id</text>
      <text x="772" y="175" fill="#58466d" font-size="14">nome</text>
    </g>
    <path d="M 218 140 H 260" stroke="#176c8d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 460 140 H 500" stroke="#176c8d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 752 140 H 710" stroke="#176c8d" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="239" y="125" text-anchor="middle" fill="#456174" font-size="12">1:N</text>
    <text x="481" y="125" text-anchor="middle" fill="#456174" font-size="12">1:N</text>
    <text x="731" y="125" text-anchor="middle" fill="#456174" font-size="12">1:N</text>
  </g>
</svg>
